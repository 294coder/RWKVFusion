datasets_cfg:
  llvip:
    crop_strategy: manual
  m3fd:
    crop_strategy: manual
  roadscene:
    with_txt_feature: yes
  tno:
    with_txt_feature: yes
  msrs:
    crop_strategy: manual
    with_txt_feature: yes
    only_resize: [224, 280]
    fast_eval_n_samples: 80
    reduce_label: yes
  vis_ir_joint:
    crop_strategy: manual
    with_txt_feature: yes
    only_resize: [224, 280]
    fast_eval_n_samples: 80
    reduce_label: yes
  med_harvard:
    task: SPECT-MRI
    with_mask: yes
    with_txt_feature: yes
    only_resize: [256, 256]
    reduce_label: yes
  sice:
    use_gt: yes
    with_txt_feature: yes
    with_mask: yes
    with_txt: yes
    output_size: 256
    transformer_ratio: 0.5
  mefb:
    with_txt_feature: yes
    with_mask: yes
    with_txt: yes
    output_size: 256
    transformer_ratio: 0.5
  realmff:
    with_mask: yes
