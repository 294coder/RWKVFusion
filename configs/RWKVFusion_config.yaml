datasets_cfg:
  msrs:
    crop_strategy: crop_resize
    with_txt_feature: yes
    only_resize: [640, 480] #[224, 280]
    fast_eval_n_samples: 80
    reduce_label: yes
    with_mask: yes
  m3fd:
    crop_strategy: crop_resize
    with_txt_feature: yes
    only_resize: [224, 280]
    fast_eval_n_samples: 80
    reduce_label: yes
    with_mask: yes
  llvip:
    crop_strategy: crop_resize
    with_txt_feature: yes
    only_resize: [224, 280]
    fast_eval_n_samples: 80
    reduce_label: yes
    with_mask: yes
  roadscene:
    with_txt_feature: yes
  tno:
    with_txt_feature: yes
  vis_ir_joint:
    crop_strategy: crop_resize
    output_size: [224, 280]
    with_txt_feature: yes
    with_mask: yes
    fast_eval_n_samples: 80
    reduce_label: yes
    random_datasets_getitem: yes
    n_thread: 4
  med_harvard:
    task: SPECT-MRI
    with_txt_feature: yes
    with_mask: yes
    only_resize: [256, 256]
    reduce_label: yes
  sice:
    with_txt_feature: yes
    with_mask: yes
    with_txt: yes
    output_size: 256
    use_gt: no
    stop_aug_when_n_iters: 1000 # -1 means no augmentation
  mefb:
    with_txt_feature: yes
    with_mask: yes
    with_txt: yes
    output_size: 256
    only_y: no
    stop_aug_when_n_iters: 1000
  realmff:
    with_mask: yes
    with_txt: yes
    output_size: 256
    use_gt: yes
    stop_aug_when_n_iters: 2_000
  mff_whu:
    with_mask: yes
    with_txt: yes
    output_size: 256
    use_gt: false
    stop_aug_when_n_iters: 2_000
  mff_mffw:
    with_mask: yes
    with_txt: yes
    output_size: 256
    use_gt: yes
    stop_aug_when_n_iters: 2_000
  lytro:
    with_mask: yes
    with_txt: yes
    only_y: no

network_configs:
  # ! change with different tasks
  model_cls_module: model.RWKVFusion.RWKVFusion

  RWKVFusion_WV3:
    ##################### Pansharpening #####################
    ## WV3
    img_channel: 8
    modal_channel: 1
    mask_channel: null
    llm_channel: 512
    out_channel: 8
    width: 32
    middle_blk_num: 1
    enc_blk_nums: [2, 1, 1]
    dec_blk_nums: [2, 1, 1]
    chan_upscales: [2, 1, 1]
    mid_window_size: 0
    enc_window_sizes: [0, 0, 0]
    dec_window_sizes: [0, 0, 0]
    MIFM_img_downsample_ratios: [4, 2, 1]
    ffn_hidden_rates: [2, 2, 2]
    with_checkpoint: no
    pt_img_size: 64
    drop_path_rate: 0.2
    if_abs_pos: no
    upscale: 4
    drop_txt_ratio: 0.0
    txt_embd_drop_ratio: 0.0
    add_multi_modal_tokens: no
    end_proj_type: 3conv
    fusion_prior: lr
    feature_prior: no
    reconstruction_head: sr
    scan_mode: K2 # [K2] may be good
    patch_merge: yes

