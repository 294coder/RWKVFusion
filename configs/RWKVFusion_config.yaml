loss_cfg:
  drmffusion:
    latent_weighted: no
    grad_loss: yes
    color_loss: no # VIF: yes, others: no
    ssim_loss: yes
    prior: null
    boundary_loss: yes
    mask_loss: no # VIF: yes, others: no
    lpips_loss: no
    color_loss_bg_masked: yes
    tv_loss: no
    pseudo_l1_const: 0. # [0.002, 0.]
    correlation_loss: no
    reduce_label: no # VIF: no
    grad_only_on_Y: no
    grad_op: "sobel_add"
    still_boundary_loss_when_gt: yes
    grad_norm: no
    ssim_implm_by: torch
    ssim_window_size: 5
    weight_dict:
      fusion_gt: 5.

      inten_f_joint: 10. # prior used
      inten_f_ir: 10.
      inten_f_vi: 10.

      color_f_cb: 2.
      color_f_cr: 2.

      grad_f_joint: 20. # [5, 40] for VIF and MEF
      ssim_f_joint: 2.

      lpips_f_gt: 1.

      tv_f: 0.1
      crr_f: 0.02

      # unused
      lpips_f_joint: 0.2
      lpips_f_ir: 0.2
      lpips_f_vi: 0.2

  filmfusion:
    prior: mean
    weight_grad: 1000
    weight_ssim: 1.
    ssim_window_size: 5

  l1ssim:
    weighted_r: [1.0, 0.1]
    implem_by: torch
    window_size: 5
    grad_norm: no

metric_name_for_save:
  fusion: val_loss # for VIF, MFF, MEF tasks
  sharpening: PSNR # [Pansharpening: SAM, HMIF: PSNR]

  check_order:
    fusion: down
    sharpening: up

logger_config:
  base_path: ./log_file/
  name: RWKVFusion
  file_mode: w
