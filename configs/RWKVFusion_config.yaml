optimizer:
  # soap cfg
  name: "soap_for_each"
  lr: 1.0e-3 # soap can allow a larger learning rate
  weight_decay: 1.0e-6
  # precondition_frequency: 2
  # betas: [0.95, 0.99]

lr_scheduler:
  name: plateau
  factor: 0.8
  patience: 10
  threshold: 1.0e-4
  threshold_mode: rel
  cooldown: 10
  min_lr: 2.0e-5

max_norm: 0.04
ema_decay: 0.999
ema_update_every: 1

